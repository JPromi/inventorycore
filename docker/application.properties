# Configuration of the container image (copied to /app/config/application.properties).
# Everything comes from environment variables; see deploy/.env.example and docs/DEPLOYMENT.md.
# Any Spring property can also be set directly, e.g. SPRING_DATASOURCE_URL or SERVER_SERVLET_SESSION_TIMEOUT.
spring.application.name=inventorycore
server.port=8080
server.servlet.session.timeout=${SESSION_TIMEOUT:24h}
# behind a reverse proxy: use X-Forwarded-Proto/-Host for redirects and the OIDC redirect URI
server.forward-headers-strategy=framework

# created on the first start only (default inv / core: change the password after the first login)
app.default-admin.username=${DEFAULT_ADMIN_USERNAME:inv}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:core}

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:inventorycore}
spring.datasource.username=${DB_USER:inventorycore}
spring.datasource.password=${DB_PASSWORD:inventorycore}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# uploaded files: keep /app/data on a volume
app.files.path=${FILES_PATH:/app/data/files}
app.files.image-max-size=1920
app.files.thumbnail-size=400
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

app.geocoding.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org}
app.geocoding.user-agent=InventoryCore (self-hosted inventory management)
app.geocoding.email=${NOMINATIM_EMAIL:}
app.geocoding.min-interval-ms=1000
