# Builds the whole application (Angular bundled into the Spring Boot JAR) as one container image
# and pushes it to the GitHub Container Registry (ghcr.io/<owner>/inventorycore).
#
# - Pushing a tag v1.2.3: image tags 1.2.3, 1.2 and latest; the app is built with version 1.2.3.
# - Manual run (Actions > Docker image > Run workflow): choose the channel, default beta.
#   The image gets the channel tag and sha-<commit>.
name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Image tag (channel)
        type: choice
        options: [beta, latest]
        default: beta

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${CHANNEL}-${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},enable=${{ github.event_name == 'push' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'push' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.channel == 'latest' }}
            type=raw,value=beta,enable=${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'beta' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=InventoryCore
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
