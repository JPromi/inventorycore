plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.jpromi'
// release builds pass the version, e.g. -PappVersion=1.2.0 (the container build does this from the Git tag)
version = findProperty('appVersion') ?: '0.0.1-SNAPSHOT'

springBoot {
	buildInfo()
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
 implementation 'org.springframework.boot:spring-boot-starter-mail'
 implementation('nl.martijndwars:web-push:5.1.2') {
     exclude group: 'org.bouncycastle'
     exclude group: 'org.asynchttpclient'
     exclude group: 'com.beust'
 }
 implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
 implementation 'org.apache.httpcomponents:httpasyncclient:4.1.5'
 implementation 'org.bitbucket.b_c:jose4j:0.9.6'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-ldap'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.security:spring-security-ldap'
	// image upload: WebP and CMYK JPEG decoding, EXIF orientation
	implementation 'com.twelvemonkeys.imageio:imageio-jpeg:3.12.0'
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
	implementation 'com.drewnoakes:metadata-extractor:2.19.0'
	compileOnly 'org.projectlombok:lombok:1.18.38'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-ldap-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
	testCompileOnly 'org.projectlombok:lombok:1.18.38'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
}

tasks.named('test') {
	useJUnitPlatform()
}

// one application: -PfrontendDist=<built Angular app> bundles the frontend into the JAR (served from /static),
// e.g. -PfrontendDist=../frontend/dist/inventorycore/browser after `npm run build`
def frontendDist = findProperty('frontendDist')
if (frontendDist) {
	tasks.named('processResources') {
		inputs.dir(frontendDist)
		from(frontendDist) {
			into 'static'
		}
	}
}
