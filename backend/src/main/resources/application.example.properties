spring.application.name=inventorycore
server.port=8080
server.servlet.session.timeout=24h

# Default admin user for local development
app.default-admin.username=${DEFAULT_ADMIN_USERNAME:admin}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:admin}

spring.datasource.url=jdbc:postgresql://SERVER:5432/inventorycore
spring.datasource.username=USER
spring.datasource.password=PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Uploaded files (images are scaled down to image-max-size pixels, previews to thumbnail-size)
app.files.path=${FILES_PATH:data/files}
app.files.image-max-size=1920
app.files.thumbnail-size=400
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB

# Address search for locations (Nominatim / OpenStreetMap). The public server allows at most
# one request per second and requires an identifying User-Agent; set a contact e-mail for it
# or point nominatim-url at your own instance.
app.geocoding.nominatim-url=https://nominatim.openstreetmap.org
app.geocoding.user-agent=InventoryCore (self-hosted inventory management)
app.geocoding.email=
app.geocoding.min-interval-ms=1000
