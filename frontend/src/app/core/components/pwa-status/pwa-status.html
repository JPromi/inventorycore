@if (!pwa.online() || pwa.updateReady() || pwa.broken()) {
    <div class="notices" role="status" aria-live="polite">
        @if (!pwa.online()) {
            <div class="notice offline">
                <svg lucideWifiOff size="17"></svg>
                <span>Keine Verbindung. Änderungen können erst wieder gespeichert werden, wenn du online bist.</span>
            </div>
        }

        @if (pwa.broken()) {
            <div class="notice">
                <svg lucideTriangleAlert size="17"></svg>
                <span>Die App muss neu geladen werden.</span>
                <button type="button" class="action" (click)="pwa.reload()">Neu laden</button>
            </div>
        } @else if (pwa.updateReady()) {
            <div class="notice">
                <svg lucideRefreshCw size="17"></svg>
                <span>Eine neue Version ist verfügbar.</span>
                <button type="button" class="action" (click)="pwa.applyUpdate()">Aktualisieren</button>
                <button type="button" class="close" title="Später" aria-label="Später" (click)="pwa.dismissUpdate()">
                    <svg lucideX size="16"></svg>
                </button>
            </div>
        }
    </div>
}
