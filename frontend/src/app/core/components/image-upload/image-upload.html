<div class="image-grid">
    @for (image of images; track $index) {
        <figure class="tile" [class.cover]="image.kind === 'THUMBNAIL'">
            <img [src]="preview(image)" [alt]="image.fileName || 'Bild'" loading="lazy" />
            @if (image.kind === 'THUMBNAIL') {
                <span class="cover-badge">
                    <svg lucideStar size="12"></svg>
                    Titelbild
                </span>
            }
            @if (!disabled) {
                <div class="tile-actions">
                    <button type="button" title="Nach vorne" [disabled]="$first" (click)="move($index, -1)">
                        <svg lucideChevronLeft size="15"></svg>
                    </button>
                    @if (image.kind !== 'THUMBNAIL') {
                        <button type="button" title="Als Titelbild verwenden" (click)="setCover($index)">
                            <svg lucideStar size="15"></svg>
                        </button>
                    }
                    <button type="button" title="Nach hinten" [disabled]="$last" (click)="move($index, 1)">
                        <svg lucideChevronRight size="15"></svg>
                    </button>
                    <button type="button" class="danger" title="Entfernen" (click)="remove($index)">
                        <svg lucideTrash2 size="15"></svg>
                    </button>
                </div>
            }
            @if (image.fileName) {
                <figcaption [title]="image.fileName">{{ image.fileName }}</figcaption>
            }
        </figure>
    }

    @for (upload of pending; track upload.id) {
        <div class="tile pending" [class.failed]="upload.error">
            @if (upload.error) {
                <svg class="state-icon" lucideCircleAlert size="22"></svg>
                <span class="pending-name" [title]="upload.name">{{ upload.name }}</span>
                <span class="pending-error">{{ upload.error }}</span>
                <button type="button" class="dismiss" title="Ausblenden" (click)="dismiss(upload)">
                    <svg lucideX size="14"></svg>
                </button>
            } @else {
                <span class="pending-name" [title]="upload.name">{{ upload.name }}</span>
                <div class="progress"><span [style.width.%]="upload.progress"></span></div>
                <span class="hint">{{ upload.progress < 100 ? upload.progress + ' %' : 'Wird verarbeitet...' }}</span>
            }
        </div>
    }

    @if (!disabled) {
        <label
            class="tile drop-zone"
            [class.dragging]="dragging"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)"
            (drop)="onDrop($event)"
        >
            <input type="file" multiple [accept]="accept" (change)="onFileInput($event)" />
            <svg lucideImageUp size="26"></svg>
            <strong>Bilder hochladen</strong>
            <span class="hint">Klicken oder hierher ziehen</span>
        </label>
    }
</div>
