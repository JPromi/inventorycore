<div class="lookup-actions">
    <button type="button" class="secondary-action compact" [disabled]="!query || !!busy" (click)="findCoordinates()"
        [title]="(query ? 'components.locationLookup.findCoordinatesTitle' : 'components.locationLookup.enterAddressFirst') | t">
        <svg lucideLocateFixed size="15"></svg>
        <span>{{ (busy === 'search' ? 'components.locationLookup.searching' : 'components.locationLookup.findCoordinates') | t }}</span>
    </button>
    <button type="button" class="secondary-action compact" [disabled]="!hasCoordinates || !!busy" (click)="findAddress()"
        [title]="(hasCoordinates ? 'components.locationLookup.findAddressTitle' : 'components.locationLookup.enterCoordinatesFirst') | t">
        <svg lucideMapPinned size="15"></svg>
        <span>{{ (busy === 'reverse' ? 'components.locationLookup.searching' : 'components.locationLookup.findAddress') | t }}</span>
    </button>
</div>

@if (coordinatesError) {
    <p class="error" role="alert">{{ coordinatesError }}</p>
} @else if (error) {
    <p class="error" role="alert">{{ error }}</p>
} @else if (message) {
    <p class="hint" role="status">{{ message }}</p>
}

@if (matches.length) {
    <ul class="matches">
        @for (match of matches; track $index) {
            <li>
                <button type="button" (click)="choose(match)">
                    <strong>{{ match.address }}</strong>
                    <small>{{ match.label }}</small>
                </button>
            </li>
        }
    </ul>
}

@if (hasCoordinates) {
    <app-location-map class="preview" [latitude]="position.latitude!" [longitude]="position.longitude!" [title]="query || ('terms.location' | t)" [immediate]="false" />
}
