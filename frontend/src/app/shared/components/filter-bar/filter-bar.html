<ng-content select="[filterSearch]" />

@if (hasFilters) {
    <button type="button" class="filter-toggle" [class.active]="activeCount" [attr.aria-expanded]="open" (click)="open = !open">
        <svg lucideSlidersHorizontal size="17"></svg>
        <span>{{ 'common.filter' | t }}</span>
        @if (activeCount) {
            <span class="count">{{ activeCount }}</span>
        }
        <svg class="chevron" lucideChevronDown size="15"></svg>
    </button>
}

<div class="filter-panel" [class.open]="open">
    <ng-content />
    @if (canReset) {
        <button type="button" class="reset" (click)="reset.emit()">
            <svg lucideX size="15"></svg>
            <span>{{ 'components.filterBar.reset' | t }}</span>
        </button>
    }
</div>
