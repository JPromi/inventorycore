<div class="theme-options" role="group" [attr.aria-label]="'theme.appearance' | t">
  @for (option of options; track option.value) {
    <button
      type="button"
      [attr.aria-pressed]="theme.preference === option.value"
      [title]="option.label | t"
      (click)="theme.select(option.value)"
    >
      <ng-container *ngComponentOutlet="option.icon; inputs: iconInputs" />
      <span>{{ option.label | t }}</span>
    </button>
  }
</div>
