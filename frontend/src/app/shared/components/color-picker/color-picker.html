<button
    #dropdownTrigger
    type="button"
    class="trigger"
    [class.compact]="compact"
    [class.open]="open"
    [disabled]="disabled"
    [attr.aria-label]="'components.colorPicker.triggerLabel' | t: { label: label, value: value || ('components.colorPicker.noColor' | t) }"
    [attr.aria-expanded]="open"
    (click)="toggle()"
>
    <span class="swatch" [class.no-color]="!value" [style.background]="value"></span>
    @if (!compact) {
        <span class="trigger-text" [class.no-color]="!value">{{ value ? value.toUpperCase() : ('components.colorPicker.noColor' | t) }}</span>
        <svg class="chevron" lucideChevronDown size="15"></svg>
    }
</button>

@if (open) {
    <div class="popover" role="dialog" [attr.aria-label]="label" [appDropdownPosition]="dropdownTrigger">
        <div class="presets">
            @if (allowEmpty) {
                <button type="button" class="preset none" [class.active]="!value" [title]="'components.colorPicker.noColor' | t" (click)="choose(null)">
                    <svg lucideBan size="14"></svg>
                </button>
            }
            @for (color of presets; track color) {
                <button
                    type="button"
                    class="preset"
                    [class.active]="value === color"
                    [style.background]="color"
                    [title]="color.toUpperCase()"
                    (click)="choose(color)"
                >
                    @if (value === color) {
                        <svg lucideCheck size="14" [style.color]="textColor"></svg>
                    }
                </button>
            }
        </div>

        <div
            class="area"
            tabindex="0"
            role="slider"
            [attr.aria-label]="'components.colorPicker.saturation' | t"
            [attr.aria-valuetext]="value"
            [style.background-color]="hueColor"
            (pointerdown)="startDrag('area', $event)"
            (pointermove)="onDrag($event)"
            (pointerup)="endDrag()"
            (pointercancel)="endDrag()"
            (keydown)="onAreaKey($event)"
        >
            <span
                class="handle"
                [style.left.%]="hsv.s * 100"
                [style.top.%]="(1 - hsv.v) * 100"
                [style.background]="value || hueColor"
            ></span>
        </div>

        <div
            class="hue"
            tabindex="0"
            role="slider"
            [attr.aria-label]="'components.colorPicker.hue' | t"
            aria-valuemin="0"
            aria-valuemax="360"
            [attr.aria-valuenow]="roundedHue"
            (pointerdown)="startDrag('hue', $event)"
            (pointermove)="onDrag($event)"
            (pointerup)="endDrag()"
            (pointercancel)="endDrag()"
            (keydown)="onHueKey($event)"
        >
            <span class="handle" [style.left.%]="(hsv.h / 360) * 100" [style.background]="hueColor"></span>
        </div>

        <div class="hex-row">
            <span class="preview" [class.no-color]="!value" [style.background]="value"></span>
            <label class="hex-field">
                <span>{{ 'components.colorPicker.hex' | t }}</span>
                <input
                    type="text"
                    maxlength="7"
                    spellcheck="false"
                    autocomplete="off"
                    [value]="hexInput"
                    (input)="onHexInput($any($event.target).value)"
                    (blur)="onHexBlur()"
                    (keydown.enter)="$event.preventDefault(); toggle()"
                    placeholder="#000000"
                />
            </label>
            <button type="button" class="done" (click)="toggle()">{{ 'components.colorPicker.done' | t }}</button>
        </div>
    </div>
}
