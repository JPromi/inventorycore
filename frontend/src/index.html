<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>InventoryCore</title>
    <base href="/" />
    <!-- viewport-fit=cover: the layout uses env(safe-area-inset-*) for notch and home indicator -->
    <!-- no zooming on phones: the layout is made for the screen width (inputs use 16px, so iOS does not zoom into them) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="description" content="Inventar, Standorte und Prüfungen an einem Ort." />

    <!-- PWA -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#b62f2f" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="InventoryCore" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Bitte JavaScript aktivieren, um InventoryCore zu verwenden.</noscript>
  </body>
</html>
